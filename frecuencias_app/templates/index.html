<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>App de Frecuencias</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .table { border-collapse: collapse; width: 100%; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px; }
        .table th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Subir archivo Excel</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% if columnas %}
            <label for="columna">Selecciona una columna:</label>
            <select name="columna">
                {% for col in columnas %}
                    <option value="{{ col }}" {% if col == columna_seleccionada %}selected{% endif %}>{{ col }}</option>
                {% endfor %}
            </select>
        {% endif %}
        <br><br>
        <button type="submit">Procesar</button>
    </form>

    {% if tabla %}
        <h2>Tabla de Frecuencia</h2>
        {{ tabla|safe }}
        <h2>Gráfico</h2>
        <img src="{{ grafico_url }}" width="600">
    {% endif %}
</body>
</html>
